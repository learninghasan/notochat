name: Verify NotoChat
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check extension JavaScript syntax
        run: node --check ../chrome-extension/background.js && node --check ../chrome-extension/panel.js
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: notochat_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest -q backend
      - name: Verify PostgreSQL isolation and concurrency
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-disposable-password@127.0.0.1:5432/notochat_qa
          APP_TOKEN: ci-disposable-token
          SEED_SAMPLE_DATA: '0'
          NOTOCHAT_DISPOSABLE_DATABASE: '1'
          PYTHONPATH: backend
        run: python backend/qa/postgres_check.py
